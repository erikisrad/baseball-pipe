<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>baseballpipe receiver</title>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
  <cast-media-player></cast-media-player>
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    // Custom message channel back to the sender -- chrome://inspect has
    // proven unreliable against this device's embedded Chromium build
    // (blank devtools window, raw debug port not directly browsable), so
    // instead of relying on remote debugging we push our own event data
    // straight to the sender over the existing Cast session, where it shows
    // up in the browser console we already know works (player.js's).
    const DEBUG_NAMESPACE = 'urn:x-cast:com.baseballpipe.debug';

    function safePayload(obj) {
      try {
        // Strips functions/DOM refs/circular structures down to plain data;
        // anything that can't survive a JSON round-trip is dropped rather
        // than throwing and losing the whole message.
        return JSON.parse(JSON.stringify(obj));
      } catch (e) {
        return { unserializable: String(obj) };
      }
    }

    function sendDebug(label, data) {
      try {
        context.sendCustomMessage(DEBUG_NAMESPACE, undefined, JSON.stringify({
          label: label,
          time: Date.now(),
          data: safePayload(data)
        }));
      } catch (e) {
        console.error('sendDebug failed:', e);
      }
    }

    // Replaces the old ERROR/PLAYER_LOAD_COMPLETE/BUFFERING-only listeners
    // with catch-alls across every event category CAF exposes (CORE is the
    // playback-lifecycle events we had before; DEBUG and FINE go deeper --
    // bitrate changes, seek events, etc.). PROGRESS, MEDIA_STATUS, and
    // TIME_UPDATE are excluded because they fire multiple times a second
    // (confirmed directly: TIME_UPDATE alone logged 158 times in ~40s in an
    // earlier capture) -- forwarding every one of those would itself add
    // meaningful CPU/network overhead on exactly the hardware we're trying
    // to measure, which would contaminate the experiment rather than
    // illuminate it.
    const NOISY_EVENT_TYPES = new Set([
      cast.framework.events.EventType.PROGRESS,
      cast.framework.events.EventType.MEDIA_STATUS,
      cast.framework.events.EventType.TIME_UPDATE
    ]);

    function logEvent(event) {
      if (NOISY_EVENT_TYPES.has(event.type)) {
        return;
      }
      if (event.type === cast.framework.events.EventType.ERROR) {
        console.error('RECEIVER ERROR:', event);
      }
      sendDebug(event.type || 'UNKNOWN_EVENT', event);
    }

    ['CORE', 'DEBUG', 'FINE'].forEach((categoryName) => {
      try {
        const category = cast.framework.events.category[categoryName];
        if (category) {
          playerManager.addEventListener(category, logEvent);
        }
      } catch (e) {
        console.error(`failed to subscribe to event category ${categoryName}:`, e);
      }
    });

    // Continuous long-task tracking (replaces needing a manual DevTools
    // Performance-trace capture at arbitrary moments to see main-thread
    // congestion). The Long Tasks API reports every task over 50ms as it
    // happens; we just accumulate count/total duration between heartbeats
    // and reset, so each heartbeat shows the *rate* since the last one --
    // directly answering whether congestion is trending upward over the
    // session, not just "was high at one sampled instant."
    let longTaskCount = 0;
    let longTaskTotalMs = 0;
    try {
      const longTaskObserver = new PerformanceObserver((list) => {
        for (const entry of list.getEntries()) {
          longTaskCount++;
          longTaskTotalMs += entry.duration;
        }
      });
      longTaskObserver.observe({ entryTypes: ['longtask'] });
    } catch (e) {
      console.error('PerformanceObserver(longtask) failed:', e);
    }

    // Periodic heartbeat: CAF's own getStats() plus the raw <video> element's
    // buffered()/readyState/networkState -- the ground-truth HTML5/MSE
    // buffering state, independent of whatever Shaka/CAF decide to report
    // via events. This is what lets us see the trend (bandwidth estimate,
    // buffered-ahead amount) leading up to and through a buffering cycle,
    // not just the isBuffering boolean flipping.
    //
    // bufferedBehindStart/bufferedAheadEnd are the specific numbers worth
    // watching: a healthy MSE player evicts old data and keeps a bounded
    // retention window behind currentTime (e.g. under a minute). If
    // bufferedBehindStart instead keeps growing toward currentTime itself
    // over the session, that means old buffered data is never being evicted
    // -- a real, specific resource growing that a JS heap snapshot can't
    // see at all, since SourceBuffer's retained media data lives in native
    // memory, not V8's heap.
    setInterval(() => {
      try {
        // stateHistory/switchHistory grow unboundedly for the life of the
        // session (confirmed directly -- a late-session heartbeat grew
        // large enough to get truncated mid-JSON by DevTools' own console
        // export). We don't use either field, so strip them before sending
        // rather than re-serializing and transmitting an ever-growing array
        // every 5 seconds on top of whatever cost Shaka's own internal
        // retention of them already carries.
        const { stateHistory, switchHistory, ...stats } = playerManager.getStats();
        // document.querySelector('video') found nothing (confirmed: every
        // heartbeat came back with currentTime/buffered all null) -- because
        // <cast-media-player> encapsulates its real <video> element inside
        // a shadow root, which a plain top-level querySelector can't pierce.
        // getMediaElement() is a real, confirmed method on the custom
        // element's own class (verified directly against the library
        // source), not on PlayerManager -- this is the actual correct way
        // to reach it.
        const castPlayerEl = document.querySelector('cast-media-player');
        const mediaElement = castPlayerEl && castPlayerEl.getMediaElement ? castPlayerEl.getMediaElement() : null;
        const buffered = [];
        if (mediaElement && mediaElement.buffered) {
          for (let i = 0; i < mediaElement.buffered.length; i++) {
            buffered.push([mediaElement.buffered.start(i), mediaElement.buffered.end(i)]);
          }
        }
        const currentTime = mediaElement ? mediaElement.currentTime : null;
        sendDebug('HEARTBEAT', {
          stats: stats,
          currentTime: currentTime,
          readyState: mediaElement ? mediaElement.readyState : null,
          networkState: mediaElement ? mediaElement.networkState : null,
          buffered: buffered,
          bufferedBehindStart: (buffered.length && currentTime != null) ? currentTime - buffered[0][0] : null,
          bufferedAheadEnd: (buffered.length && currentTime != null) ? buffered[buffered.length - 1][1] - currentTime : null,
          domNodeCount: document.getElementsByTagName('*').length,
          longTaskCount: longTaskCount,
          longTaskTotalMs: longTaskTotalMs
        });
        // Reset so the next heartbeat reports the delta since this one,
        // not a running cumulative total.
        longTaskCount = 0;
        longTaskTotalMs = 0;
      } catch (e) {
        console.error('heartbeat failed:', e);
      }
    }, 5000);

    // The one line this whole page exists for: use Shaka Player's JS-level
    // HLS parsing/demuxing instead of cast_shell's native pipeline, to test
    // whether that avoids whatever the native pipeline is mishandling at
    // the ad-break discontinuity boundary (see investigation history --
    // B-frame/non-B-frame GOP structure switching across #EXT-X-DISCONTINUITY,
    // present in every confirmed stall, old and new Chromecast hardware alike).
    const options = new cast.framework.CastReceiverOptions();
    options.useShakaForHls = true;

    // CAF requires custom message namespaces to be declared up front --
    // calling sendCustomMessage() on an undeclared namespace after start()
    // has already run throws "New namespaces can not be requested after
    // start has been called" every single time, which is exactly why every
    // sendDebug() call above has been silently failing (into its own catch)
    // since this page was first written.
    options.customNamespaces = {
      [DEBUG_NAMESPACE]: cast.framework.system.MessageType.STRING
    };

    context.start(options);
  </script>
</body>
</html>
