<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Baseball Pipe</title>
        <link rel="stylesheet" href="/static/baseball_pipe.css">

        <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
        <link rel="stylesheet" href="https://unpkg.com/@silvermine/videojs-chromecast@1.5.0/dist/silvermine-videojs-chromecast.css">
    </head>
    <body>
        <div class="container">
            <p class="date-display">{{ p_date }}</p>
            <p class="date-display">{{ away_name }} @ {{ home_name }}</p>
            <p class="date-display">Broadcast via {{ broadcast_name }}</p>
            <hr class="date-line">
            <div class="info-row">
                <p>{{ series_description }}{{ series_string }}</p>
                <div class="info-right">
                    <p>{{ time_str }}</p>
                </div>
            </div>
            </br>

            {% if error %}
            <p><strong>Stream Error:</strong> {{ error }}</p>
            {% else %}

            {% if cast_type in ("AM", "FM") %}
            <audio src="{{ video_url }}" controls autoplay></audio>
            {% else %}
            <video id="hls-cast-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" crossorigin="anonymous">
                <source src="{{ video_url }}" type="application/vnd.apple.mpegurl" />
            </video>

            <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
            <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
            <script src="https://unpkg.com/@silvermine/videojs-chromecast@1.5.0/dist/silvermine-videojs-chromecast.min.js"></script>
            <script src="/static/player.js"></script>
            {% endif %}

            {% endif %}

            <p><a href="{{ back_url }}"><-- back</a></p>
        </div>
    </body>
</html>
